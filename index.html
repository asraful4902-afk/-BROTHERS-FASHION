<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brother's Fashion</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Announcement Bar -->
    <div class="top-bar">
        FREE DELIVERY ON ORDERS OVER ৳999
    </div>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="menu-icon" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="logo">
            <!-- আপনার লোগো এখানে যুক্ত করুন -->
            <h2>BROTHERS FASHION</h2>
        </div>
        <div class="nav-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
    </header>

    <!-- Hero Section with Cover Photo -->
    <section class="hero-section">
        <!-- আপনার কভার ছবি এখানে যুক্ত করুন -->
        <div class="cover-photo">
            <h3>STYLE MEETS COMFORT</h3>
            <p>PREMIUM QUALITY CLOTHING</p>
            <a href="#products" class="btn">SHOP NOW</a>
        </div>
    </section>

    <!-- Featured Products -->
    <section id="products" class="product-section">
        <h2>FEATURED PRODUCTS</h2>
        <div class="product-grid">
            
            <!-- Product 1 -->
            <div class="product-card">
                <img src="product1.jpg" alt="Brown Stripe Polo T-Shirt">
                <h3>Brown Stripe Polo T-Shirt</h3>
                <p>Price: ৳690</p>
                <button class="order-btn" onclick="orderNow('Brown Stripe Polo T-Shirt', 690)">ORDER NOW</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="product2.jpg" alt="Premium Mauve Shirt">
                <h3>Premium Mauve Shirt</h3>
                <p>Price: ৳790</p>
                <button class="order-btn" onclick="orderNow('Premium Mauve Shirt', 790)">ORDER NOW</button>
            </div>

        </div>
    </section>

    <!-- Order Modal Form (Hidden by default) -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3>অর্ডার ফর্ম</h3>
            <form id="checkoutForm">
                <label for="name">নাম:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="address">ঠিকানা:</label>
                <input type="text" id="address" name="address" required>

                <label for="phone">ফোন নম্বর:</label>
                <input type="tel" id="phone" name="phone" required>

                <button type="submit" class="btn">কনফার্ম অর্ডার</button>
            </form>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
